id: dsc_setup
requirements:
- name: ecoscope-platform
  version: '>=2.15.0, <2.16.0'
  channel: https://repo.prefix.dev/ecoscope-workflows/

- name: ecoscope-workflows-ext-custom
  version: 0.1.0rc14.*
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-ste
  version: 0.0.0rc1.*
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-distance-sample-counts
  version: 1.1.3.*
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: pydeck
  version: ==0.9.2
  channel: conda-forge

task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped

rjsf-overrides:
  properties:
    er_connection.title: Conservancy
    er_connection.description: The conservancy's EarthRanger site to set up. With "Create the missing items" off, the run
      only lists what would be created; nothing on the site changes until it is on.
    site_setup.title: DSC Setup


workflow:
- name: Set Workflow Details
  id: workflow_details
  task: set_workflow_details

- name: Connect to EarthRanger
  id: er_connection
  task: set_er_connection

- name: Set Up DSC
  id: site_setup
  task: setup_dsc_site
  partial:
    client: ${{ workflow.er_connection.return }}
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    apply: true
    transects: null

- name: Count Items Still to Create
  id: to_create_count
  task: count_status
  partial:
    table: ${{ workflow.site_setup.return }}
    statuses:
    - Create
    - Failed
    - Not run
    status_column: Status

- name: Fetch Transects
  id: transects
  task: fetch_dsc_transects
  partial:
    client: ${{ workflow.er_connection.return }}
    run_after: ${{ workflow.site_setup.return }}

- name: Persist Setup Table
  id: persist_setup
  task: persist_df
  partial:
    df: ${{ workflow.site_setup.return }}
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename: dsc_setup
    filetype: csv

- name: Count Created Items
  id: created_count
  task: count_status
  partial:
    table: ${{ workflow.site_setup.return }}
    statuses:
    - Created
    status_column: Status

- name: Still to Create Widget
  id: to_create_widget
  task: create_single_value_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Still to create
    data: ${{ workflow.to_create_count.return }}
    decimal_places: 0

- name: Check DSC Setup
  id: dsc_checklist
  task: check_dsc_setup
  partial:
    client: ${{ workflow.er_connection.return }}
    run_after: ${{ workflow.site_setup.return }}

- name: Persist Checklist
  id: persist_checklist
  task: persist_df
  partial:
    df: ${{ workflow.dsc_checklist.return }}
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename: dsc_checklist
    filetype: csv

- name: Draw Onboarding Progress
  id: progress
  task: draw_onboarding_progress
  partial:
    checklist: ${{ workflow.dsc_checklist.return }}

- name: Next Steps
  id: next_steps
  task: summarize_dsc_next_steps
  partial:
    setup: ${{ workflow.site_setup.return }}
    checklist: ${{ workflow.dsc_checklist.return }}

- name: Format Checklist
  id: formatted_checklist
  task: format_dsc_checklist
  partial:
    checklist: ${{ workflow.dsc_checklist.return }}
    setup: ${{ workflow.site_setup.return }}

- name: Count Failed Checks
  id: failed_count
  task: count_status
  partial:
    table: ${{ workflow.dsc_checklist.return }}
    statuses:
    - Fail
    status_column: Status

- name: Count Warnings
  id: warning_count
  task: count_status
  partial:
    table: ${{ workflow.dsc_checklist.return }}
    statuses:
    - Warning
    status_column: Status

- name: Checks Passing
  id: passing_percent
  task: checks_passing_percent
  partial:
    checklist: ${{ workflow.dsc_checklist.return }}

- name: Analysis IDs
  id: analysis_ids
  task: summarize_dsc_analysis_ids
  partial:
    checklist: ${{ workflow.dsc_checklist.return }}

- name: Persist Onboarding Progress
  id: persist_progress
  task: persist_text
  partial:
    text: ${{ workflow.progress.return }}
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename: dsc_onboarding_progress.html

- name: Next Steps Widget
  id: next_steps_widget
  task: create_text_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: What to Do Next
    data: ${{ workflow.next_steps.return }}

- name: Draw Checklist Table
  id: checklist_table
  task: draw_status_table
  partial:
    dataframe: ${{ workflow.formatted_checklist.return }}
    status_column: Status
    match: contains
    color_scope: cell
    columns: null
    table_config: null
    colors:
    - value: Pass
      color: '#e6f4ea'
      text_color: '#1e6b34'
    - value: Fail
      color: '#fde8e8'
      text_color: '#9b1c1c'
    - value: Warning
      color: '#fff4e0'
      text_color: '#8a5300'
    - value: Info
      color: '#f1f3f5'
      text_color: '#495057'

- name: Analysis IDs Widget
  id: analysis_ids_widget
  task: create_text_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: For DSC Analysis
    data: ${{ workflow.analysis_ids.return }}

- name: Persist Checklist Table HTML
  id: persist_checklist_table
  task: persist_text
  partial:
    text: ${{ workflow.checklist_table.return }}
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename: dsc_checklist_table.html

- name: Onboarding Progress Widget
  id: progress_widget
  task: create_table_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Onboarding Progress
    data: ${{ workflow.persist_progress.return }}

- name: Created Widget
  id: created_widget
  task: create_single_value_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Created this run
    data: ${{ workflow.created_count.return }}
    decimal_places: 0

- name: Warnings Widget
  id: warning_widget
  task: create_single_value_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Warnings
    data: ${{ workflow.warning_count.return }}
    decimal_places: 0

- name: Checklist Widget
  id: checklist_widget
  task: create_table_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: DSC Checklist
    data: ${{ workflow.persist_checklist_table.return }}

- name: Failed Checks Widget
  id: failed_widget
  task: create_single_value_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Checks failed
    data: ${{ workflow.failed_count.return }}
    decimal_places: 0

- name: Checks Passing Widget
  id: passing_widget
  task: create_single_value_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Checks passing (%)
    data: ${{ workflow.passing_percent.return }}
    decimal_places: 0

- name: Gather Dashboard
  id: dashboard
  task: gather_dashboard
  partial:
    details: ${{ workflow.workflow_details.return }}
    time_range: null
    widgets:
    - ${{ workflow.created_widget.return }}
    - ${{ workflow.to_create_widget.return }}
    - ${{ workflow.failed_widget.return }}
    - ${{ workflow.warning_widget.return }}
    - ${{ workflow.passing_widget.return }}
    - ${{ workflow.progress_widget.return }}
    - ${{ workflow.next_steps_widget.return }}
    - ${{ workflow.analysis_ids_widget.return }}
    - ${{ workflow.checklist_widget.return }}

